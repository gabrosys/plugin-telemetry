name: e2e

on:
  workflow_dispatch:
    inputs:
      suite:
        description: e2e suite to run
        type: choice
        options: [admission, engine, plugin]
        default: plugin

permissions: {}

jobs:
  e2e:
    name: e2e (${{ inputs.suite }}${{ matrix.cnpg != 'none' && format(', CNPG {0}', matrix.cnpg) || '' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        cnpg: ${{ fromJSON(inputs.suite == 'engine' && '["none"]' || '["v1.30.1","main"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run suite
        env:
          SUITE: ${{ inputs.suite }}
          CNPG_VERSION: ${{ matrix.cnpg }}
        run: make "e2e-${SUITE}" CNPG_VERSION="${CNPG_VERSION}"
