# want: spec.metrics.groups[0].name in body should be at least 1 chars long
apiVersion: telemetry.gabrosys.github.io/v1alpha1
kind: TelemetryExporter
metadata:
  name: default
  namespace: app
spec:
  exporter:
    endpoint: https://collector:4318
  metrics:
    groups:
    - name: ""
      queries: [backends]
