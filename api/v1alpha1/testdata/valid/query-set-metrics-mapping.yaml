apiVersion: telemetry.gabrosys.github.io/v1alpha1
kind: MetricQuerySet
metadata:
  name: mapped
  namespace: app
spec:
  queries:
    replication:
      query: SELECT state FROM pg_stat_replication
      metrics:
      - state:
          usage: MAPPEDMETRIC
          metrics_mapping: {streaming: 1, catchup: 2.5}
    both:
      query: SELECT state FROM pg_stat_replication
      metrics:
      - state:
          usage: MAPPEDMETRIC
          metric_mapping: {streaming: 1}
          metrics_mapping: {streaming: 5}
