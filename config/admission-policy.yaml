apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: plugin-telemetry-identities
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [secrets, serviceaccounts]
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [serviceaccounts/token]
  matchConditions:
    - name: plugin-service-account
      expression: request.userInfo.username == 'system:serviceaccount:cnpg-system:plugin-telemetry'
  variables:
    - name: tokenRequest
      expression: request.resource.resource == 'serviceaccounts' && request.?subResource.orValue('') == 'token'
    - name: secret
      expression: request.resource.resource == 'secrets'
    - name: newAllowed
      expression: >-
        request.operation == 'DELETE' || (variables.secret
          ? object.?type.orValue('') == 'kubernetes.io/service-account-token' &&
            object.?metadata.annotations['kubernetes.io/service-account.name'].orValue('').endsWith('-telemetry') &&
            object.metadata.name == object.metadata.annotations['kubernetes.io/service-account.name'] + '-token'
          : object.metadata.name.endsWith('-telemetry'))
    - name: oldAllowed
      expression: >-
        request.operation == 'CREATE' || (variables.secret
          ? oldObject.?type.orValue('') == 'kubernetes.io/service-account-token' &&
            oldObject.?metadata.annotations['kubernetes.io/service-account.name'].orValue('').endsWith('-telemetry') &&
            oldObject.metadata.name == oldObject.metadata.annotations['kubernetes.io/service-account.name'] + '-token'
          : oldObject.metadata.name.endsWith('-telemetry'))
  validations:
    - expression: variables.tokenRequest || (variables.newAllowed && variables.oldAllowed)
      reason: Forbidden
      message: >-
        plugin-telemetry-identities: plugin-telemetry may write only ServiceAccounts named *-telemetry and their
        kubernetes.io/service-account-token Secrets named <account>-token
    - expression: '!variables.tokenRequest'
      reason: Forbidden
      message: >-
        plugin-telemetry-identities: plugin-telemetry may not request ServiceAccount tokens (TokenRequest)
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: plugin-telemetry-identities
spec:
  policyName: plugin-telemetry-identities
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: plugin-telemetry-roles
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [rbac.authorization.k8s.io]
        apiVersions: [v1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [roles, rolebindings]
  matchConditions:
    - name: plugin-service-account
      expression: request.userInfo.username == 'system:serviceaccount:cnpg-system:plugin-telemetry'
  variables:
    - name: deleting
      expression: request.operation == 'DELETE'
    - name: role
      expression: request.resource.resource == 'roles'
    - name: binding
      expression: request.resource.resource == 'rolebindings'
    # Role.rules has no omitempty, so a Role without rules has rules: null.
    - name: readOnly
      expression: >-
        object.rules == null || object.rules.all(rule, rule.verbs.all(verb, verb in ['get', 'list', 'watch']))
    - name: rulesKept
      expression: request.operation == 'UPDATE' && object.rules == oldObject.rules
    - name: ownRole
      expression: >-
        object.roleRef.apiGroup == 'rbac.authorization.k8s.io' && object.roleRef.kind == 'Role' &&
          object.roleRef.name == object.metadata.name
    - name: subjects
      expression: object.?subjects.orValue([])
    - name: ownAccount
      expression: >-
        size(variables.subjects) == 1 && variables.subjects[0].kind == 'ServiceAccount' &&
          variables.subjects[0].name == object.metadata.name &&
          variables.subjects[0].?namespace.orValue('') == request.namespace
    - name: subjectsKept
      expression: request.operation == 'UPDATE' && variables.subjects == oldObject.?subjects.orValue([])
  validations:
    - expression: >-
        (variables.deleting ? oldObject : object).metadata.name.endsWith('-telemetry')
      reason: Forbidden
      message: >-
        plugin-telemetry-roles: plugin-telemetry may write only Roles and RoleBindings named *-telemetry
    - expression: variables.deleting || !variables.role || variables.readOnly || variables.rulesKept
      reason: Forbidden
      message: >-
        plugin-telemetry-roles: plugin-telemetry may grant only get, list and watch in a Role
    - expression: variables.deleting || !variables.binding || variables.ownRole
      reason: Forbidden
      message: >-
        plugin-telemetry-roles: plugin-telemetry may bind a RoleBinding only to the Role of the same name
    - expression: variables.deleting || !variables.binding || variables.ownAccount || variables.subjectsKept
      reason: Forbidden
      message: >-
        plugin-telemetry-roles: plugin-telemetry may bind only the ServiceAccount of the same name, in the
        RoleBinding's namespace
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: plugin-telemetry-roles
spec:
  policyName: plugin-telemetry-roles
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: plugin-telemetry-reserved-names
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [postgresql.cnpg.io]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [poolers]
  validations:
    - expression: "!object.metadata.name.endsWith('.telemetry')"
      reason: Invalid
      message: Pooler names ending in .telemetry are reserved for the telemetry plugin's identity objects
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: plugin-telemetry-reserved-names
spec:
  policyName: plugin-telemetry-reserved-names
  validationActions: [Deny]
