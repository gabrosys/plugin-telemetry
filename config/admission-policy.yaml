apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: plugin-telemetry-identities
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [secrets, serviceaccounts]
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [serviceaccounts/token]
  matchConditions:
    - name: plugin-or-identity-account
      expression: >-
        request.userInfo.username.startsWith('system:serviceaccount:') &&
          (request.userInfo.username.endsWith(':plugin-telemetry') ||
            request.userInfo.username.endsWith('.telemetry'))
  variables:
    - name: tokenRequest
      expression: request.resource.resource == 'serviceaccounts' && request.?subResource.orValue('') == 'token'
    - name: secret
      expression: request.resource.resource == 'secrets'
    - name: target
      expression: "request.operation == 'DELETE' ? oldObject : object"
    - name: allowed
      expression: >-
        variables.secret
          ? variables.target.?type.orValue('') == 'kubernetes.io/service-account-token' &&
            variables.target.?metadata.annotations['kubernetes.io/service-account.name'].orValue('').endsWith('.telemetry') &&
            variables.target.metadata.name == variables.target.metadata.annotations['kubernetes.io/service-account.name'] + '-token' &&
            (request.operation != 'UPDATE' ||
              oldObject.?metadata.annotations['kubernetes.io/service-account.name'].orValue('') ==
                variables.target.metadata.annotations['kubernetes.io/service-account.name'])
          : variables.target.metadata.name.endsWith('.telemetry')
  validations:
    - expression: variables.tokenRequest || variables.allowed
      reason: Forbidden
      message: only ServiceAccounts named *.telemetry, and kubernetes.io/service-account-token Secrets named <account>-token for them, may be written
    - expression: '!variables.tokenRequest'
      reason: Forbidden
      message: ServiceAccount tokens may not be requested (TokenRequest)
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: plugin-telemetry-identities
spec:
  policyName: plugin-telemetry-identities
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: plugin-telemetry-roles
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [rbac.authorization.k8s.io]
        apiVersions: [v1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [roles, rolebindings]
  matchConditions:
    - name: plugin-or-identity-account
      expression: >-
        request.userInfo.username.startsWith('system:serviceaccount:') &&
          (request.userInfo.username.endsWith(':plugin-telemetry') ||
            request.userInfo.username.endsWith('.telemetry'))
  variables:
    - name: deleting
      expression: request.operation == 'DELETE'
    - name: role
      expression: request.resource.resource == 'roles'
    - name: binding
      expression: request.resource.resource == 'rolebindings'
    # Role.rules has no omitempty, so a Role without rules has rules: null.
    - name: readOnly
      expression: >-
        object.rules == null || object.rules.all(rule, rule.verbs.all(verb, verb in ['get', 'list', 'watch']))
    - name: ownRole
      expression: object.roleRef.kind == 'Role' && object.roleRef.name == object.metadata.name
    - name: subjects
      expression: object.?subjects.orValue([])
    - name: ownAccount
      expression: >-
        size(variables.subjects) == 1 && variables.subjects[0].kind == 'ServiceAccount' &&
          variables.subjects[0].name == object.metadata.name &&
          variables.subjects[0].?namespace.orValue('') == request.namespace
  validations:
    - expression: "(variables.deleting ? oldObject : object).metadata.name.endsWith('.telemetry')"
      reason: Forbidden
      message: only Roles and RoleBindings named *.telemetry may be written or deleted
    - expression: variables.deleting || !variables.role || variables.readOnly
      reason: Forbidden
      message: a Role may grant only get, list and watch
    - expression: variables.deleting || !variables.binding || variables.ownRole
      reason: Forbidden
      message: a RoleBinding may refer only to the Role of its own name
    - expression: variables.deleting || !variables.binding || variables.ownAccount
      reason: Forbidden
      message: a RoleBinding may bind only the ServiceAccount of its own name, in its own namespace
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: plugin-telemetry-roles
spec:
  policyName: plugin-telemetry-roles
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: plugin-telemetry-reserved-names
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [postgresql.cnpg.io]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [poolers]
  validations:
    - expression: "!object.metadata.name.endsWith('.telemetry')"
      reason: Invalid
      message: Pooler names ending in .telemetry are reserved for the telemetry plugin's identity objects
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: plugin-telemetry-reserved-names
spec:
  policyName: plugin-telemetry-reserved-names
  validationActions: [Deny]
