---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: metricquerysets.telemetry.gabrosys.github.io
spec:
  group: telemetry.gabrosys.github.io
  names:
    kind: MetricQuerySet
    listKind: MetricQuerySetList
    plural: metricquerysets
    shortNames:
    - mqs
    singular: metricqueryset
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          MetricQuerySet holds custom metric queries in the CloudNativePG format: the same field names and
          meanings as the queries in a CloudNativePG monitoring ConfigMap, as a schema Kubernetes validates
          when the resource is applied. A TelemetryExporter lists the sets it uses in spec.metrics.querySets.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec holds the queries.
            properties:
              queries:
                additionalProperties:
                  description: |-
                    Query is one query and the metrics its result columns produce. Field names and meanings are those
                    of a CloudNativePG custom query.
                  properties:
                    cache_seconds:
                      description: CacheSeconds is how long a result is reused before
                        the query runs again.
                      format: int64
                      minimum: 0
                      type: integer
                    master:
                      description: Master runs the query on the primary only. It is
                        the old name of Primary.
                      type: boolean
                    metrics:
                      description: |-
                        Metrics lists the result columns, one single-key item per column: the key is the column name
                        and the value says how to use it.
                      items:
                        additionalProperties:
                          description: ColumnSpec says how a result column is used.
                          properties:
                            description:
                              description: Description is the metric's description.
                              type: string
                            metric_mapping:
                              additionalProperties:
                                type: number
                              description: MetricMapping maps the text values of a
                                MAPPEDMETRIC column to numbers.
                              maxProperties: 256
                              type: object
                            metrics_mapping:
                              additionalProperties:
                                type: number
                              description: |-
                                MetricsMapping is MetricMapping under the other spelling, the one CloudNativePG's documentation
                                uses. MetricMapping wins when both are set.
                              maxProperties: 256
                              type: object
                            name:
                              description: Name replaces the column name in the metric
                                name.
                              type: string
                            pg_version:
                              description: PgVersion is a semantic version range of
                                PostgreSQL servers the column applies to.
                              type: string
                            usage:
                              description: |-
                                Usage is what the column is: a LABEL of every metric of the query, a COUNTER, a GAUGE, a
                                HISTOGRAM, a MAPPEDMETRIC whose text is turned into a number through MetricMapping, a DURATION
                                whose text is turned into milliseconds, or DISCARD to ignore it.
                              enum:
                              - LABEL
                              - COUNTER
                              - GAUGE
                              - HISTOGRAM
                              - MAPPEDMETRIC
                              - DURATION
                              - DISCARD
                              type: string
                          required:
                          - usage
                          type: object
                        description: 'MetricColumn describes one result column: a
                          single entry whose key is the column name.'
                        maxProperties: 1
                        minProperties: 1
                        type: object
                        x-kubernetes-validations:
                        - message: column names must match ^[a-zA-Z_][a-zA-Z0-9_]{0,62}$
                          rule: self.all(k, k.matches('^[a-zA-Z_][a-zA-Z0-9_]{0,62}$'))
                      maxItems: 128
                      minItems: 1
                      type: array
                      x-kubernetes-list-type: atomic
                    name:
                      description: Name replaces the query name in the metric names.
                      type: string
                    predicate_query:
                      description: PredicateQuery is SQL that must return a row for
                        Query to run.
                      type: string
                    primary:
                      description: Primary runs the query on the primary only.
                      type: boolean
                    query:
                      description: Query is the SQL to run.
                      type: string
                    runonserver:
                      description: RunOnServer is a semantic version range of PostgreSQL
                        servers the query runs on.
                      type: string
                    target_databases:
                      description: |-
                        TargetDatabases lists the databases to run the query in. Names may use wildcards. The default is
                        the cluster's default database.
                      items:
                        type: string
                      maxItems: 64
                      type: array
                  required:
                  - metrics
                  - query
                  type: object
                description: |-
                  Queries maps a query name to its definition. A name starts with a letter or underscore and
                  continues with letters, digits and underscores, up to 63 characters.
                maxProperties: 128
                minProperties: 1
                type: object
                x-kubernetes-validations:
                - message: query names must match ^[a-zA-Z_][a-zA-Z0-9_]{0,62}$
                  rule: self.all(k, k.matches('^[a-zA-Z_][a-zA-Z0-9_]{0,62}$'))
            required:
            - queries
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources: {}
