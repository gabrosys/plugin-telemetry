apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - crd
  - certificates.yaml
  - rbac.yaml
  - service.yaml
  - deployment.yaml
  - priorityclass.yaml
  - pdb.yaml
  - admission-policy.yaml
images:
  - name: plugin-telemetry
    newName: ghcr.io/gabrosys/plugin-telemetry
configMapGenerator:
  - name: telemetry-sidecar-image
    namespace: cnpg-system
    literals:
      - image=
generatorOptions:
  disableNameSuffixHash: true
