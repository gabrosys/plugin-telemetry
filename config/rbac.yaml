apiVersion: v1
kind: ServiceAccount
metadata:
  name: plugin-telemetry
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: plugin-telemetry
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [telemetry-sidecar-image]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: plugin-telemetry
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: plugin-telemetry
subjects:
  - kind: ServiceAccount
    name: plugin-telemetry
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: plugin-telemetry
rules:
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    verbs: [get, list, watch]
  - apiGroups: [telemetry.gabrosys.github.io]
    resources: [telemetryexporters, metricquerysets]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch, create, patch, delete]
  - apiGroups: [""]
    resources: [serviceaccounts]
    verbs: [get, list, watch, create, patch, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, list, watch, create, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: plugin-telemetry
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: plugin-telemetry
subjects:
  - kind: ServiceAccount
    name: plugin-telemetry
