apiVersion: v1
kind: ServiceAccount
metadata:
  name: plugin-telemetry
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: plugin-telemetry
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [telemetry-sidecar-image]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: plugin-telemetry
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: plugin-telemetry
subjects:
  - kind: ServiceAccount
    name: plugin-telemetry
