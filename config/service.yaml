apiVersion: v1
kind: Service
metadata:
  name: plugin-telemetry
  namespace: cnpg-system
  labels:
    cnpg.io/pluginName: telemetry.gabrosys.github.io
  annotations:
    cnpg.io/pluginClientSecret: plugin-telemetry-client-tls
    cnpg.io/pluginServerSecret: plugin-telemetry-server-tls
    cnpg.io/pluginPort: "9090"
spec:
  selector:
    app.kubernetes.io/name: plugin-telemetry
  ports:
    - name: grpc
      port: 9090
      targetPort: 9090
      protocol: TCP
