# The OpenTelemetry Collector the e2e suites export to. hack/deploy.sh replaces the two image placeholders.
# file exporter keys: open-telemetry/opentelemetry-collector-contrib v0.165.0 exporter/fileexporter/README.md.
apiVersion: v1
kind: Namespace
metadata:
  name: telemetry-e2e
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: collector
  namespace: telemetry-e2e
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 200

    exporters:
      file:
        path: /data/metrics.jsonl
        format: json
        rotation:
          max_megabytes: 10
          max_backups: 3
      debug:
        verbosity: basic

    service:
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [memory_limiter]
          exporters: [file, debug]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector
  namespace: telemetry-e2e
  labels:
    app.kubernetes.io/name: collector
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: collector
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: __COLLECTOR_IMAGE__
          imagePullPolicy: IfNotPresent
          args:
            - --config=/conf/config.yaml
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          readinessProbe:
            tcpSocket:
              port: otlp-http
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /conf
              readOnly: true
            - name: data
              mountPath: /data
        # The collector image has no shell or tail; this container reads the file for the tests.
        - name: reader
          image: __POSTGRES_IMAGE__
          imagePullPolicy: IfNotPresent
          command: [sleep, infinity]
          resources:
            requests:
              cpu: 1m
              memory: 8Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: collector
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: collector
  namespace: telemetry-e2e
spec:
  selector:
    app.kubernetes.io/name: collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
