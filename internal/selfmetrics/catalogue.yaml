- component: engine
  name: cnpg_otel_query_runs_total
  instrument: counter
  unit: "{run}"
  description: Query runs by outcome (ok, error, timeout, skipped, capped, denied).
  attributes: [query, database, outcome]
- component: engine
  name: cnpg_otel_query_last_duration_seconds
  instrument: gauge
  unit: s
  description: Duration of the last run of a query.
  attributes: [query, database]
- component: engine
  name: cnpg_otel_query_last_success_timestamp_seconds
  instrument: gauge
  unit: s
  description: Unix time of the last run of a query that returned rows (outcome ok).
  attributes: [query, database]
- component: engine
  name: cnpg_otel_query_interval_seconds
  instrument: gauge
  unit: s
  description: Effective run interval of a query.
  attributes: [query]
- component: engine
  name: cnpg_otel_query_capped_series
  instrument: gauge
  unit: "{series}"
  description: Series a capped query would have produced in its last run.
  attributes: [query, database]
- component: engine
  name: cnpg_otel_query_dropped_series_total
  instrument: counter
  unit: "{series}"
  description: Series dropped from a query, by reason.
  attributes: [query, database, reason]
- component: engine
  name: cnpg_otel_series
  instrument: gauge
  unit: "{series}"
  description: Series currently held for export.
- component: engine
  name: cnpg_otel_config_loads_total
  instrument: counter
  unit: "{load}"
  description: Configuration loads by source and outcome (ok, error, denied).
  attributes: [source, outcome]
- component: engine
  name: cnpg_otel_config_duplicate_queries_total
  instrument: counter
  unit: "{query}"
  description: Duplicate query names found while loading a source.
  attributes: [source]
- component: engine
  name: cnpg_otel_config_info
  instrument: gauge
  unit: ""
  description: Always 1; the active configuration generation and hash are attributes.
  attributes: [generation, hash]
- component: engine
  name: cnpg_otel_check
  instrument: gauge
  unit: ""
  description: 1 if a live check holds, 0 otherwise, from the last facts round (pg_monitor, read_only, track_io_timing, track_wal_io_timing, track_functions). read_only checks the engine's transactions, so it is 1 while they run read-only (transaction_read_only=on).
  attributes: [check]
- component: engine
  name: cnpg_otel_exports_total
  instrument: counter
  unit: "{export}"
  description: Export operations by outcome (ok, error, skipped).
  attributes: [outcome]
- component: engine
  name: cnpg_otel_last_export_success_timestamp_seconds
  instrument: gauge
  unit: s
  description: Unix time of the last successful export.
- component: engine
  name: otel.sdk.exporter.metric_data_point.exported
  instrument: counter
  unit: "{data_point}"
  description: Data points an export operation sent; rejected points count as failed with error.type=rejected. error.type is set only on failure.
  attributes: [error.type, otel.component.type, otel.component.name, server.address, server.port]
- component: engine
  name: otel.sdk.exporter.operation.duration
  instrument: histogram
  unit: s
  description: Duration of an export operation after the last retry, in a single bucket. error.type is set only on failure, http.response.status_code only for HTTP.
  attributes: [error.type, http.response.status_code, otel.component.type, otel.component.name, server.address, server.port]
- component: engine
  name: cnpg_collector_collections_total
  instrument: counter
  unit: ""
  description: Total number of times PostgreSQL was accessed for metrics.
- component: engine
  name: cnpg_collector_collection_errors_total
  instrument: counter
  unit: ""
  description: Total errors occurred accessing PostgreSQL for metrics.
  attributes: [collector]
- component: engine
  name: cnpg_collector_last_collection_error
  instrument: gauge
  unit: ""
  description: 1 if the last collection ended with error, 0 otherwise.
- component: engine
  name: cnpg_collector_collection_duration_seconds
  instrument: gauge
  unit: ""
  description: Collection time duration in seconds
  attributes: [collector]
- component: plugin
  name: cnpg_otel_plugin_hook_calls_total
  instrument: counter
  unit: "{call}"
  description: Hook calls by service (lifecycle, operator), operation (create, evaluate, set_status) and outcome (patched, unchanged, skipped, error, noop, status).
  attributes: [service, operation, outcome]
- component: plugin
  name: cnpg_otel_plugin_hook_duration_seconds
  instrument: histogram
  unit: s
  description: Duration of hook calls, in a single bucket.
  attributes: [service, operation]
- component: plugin
  name: cnpg_otel_plugin_identity_reconciles_total
  instrument: counter
  unit: "{reconcile}"
  description: Identity controller reconciles by outcome (ok, error).
  attributes: [outcome]
